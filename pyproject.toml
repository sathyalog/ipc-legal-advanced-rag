[project]
name = "ipc-rag"
version = "0.2.0"
description = "IPC legal assistant: structure-aware RAG with LlamaIndex + Qdrant, evaluated with RAGAS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "llama-index-core==0.14.25",
    "llama-index-vector-stores-qdrant==0.10.3",
    "llama-index-embeddings-huggingface==0.8.0",
    "llama-index-llms-ollama==0.11.0",
    "llama-index-llms-anthropic==0.12.1",
    "qdrant-client==1.19.1",
    "fastembed==0.8.1",
    "sentence-transformers==6.1.0",
    "pymupdf==1.28.2",
    "rapidfuzz==3.14.6",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "anthropic==1.8.0",
    "streamlit==1.64.0",
]

[project.scripts]
ipc-ingest = "ipc_rag.ingest.__main__:main"   # uv run ipc-ingest [--rebuild]
ipc-eval = "ipc_rag.eval.run:main"            # uv run ipc-eval retrieval | ragas ...
ipc-testset = "ipc_rag.eval.testset:main"     # uv run ipc-testset --size 60
ipc-app = "ipc_rag.app:main"                  # uv run ipc-app  (Streamlit UI)

[dependency-groups]
# installed by default with `uv sync`; skip with `uv sync --no-dev` (e.g. for deployment)
dev = [
    "ragas==0.4.3",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, which 0.4.x removed
    "langchain-community==0.3.31",
    "langchain-text-splitters==1.1.2",  # legacy-baseline recreation only
    "openai==3.3.0",                    # RAGAS judge via Ollama's OpenAI-compatible endpoint
    "instructor==1.17.0",
    "diskcache==5.6.3",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ipc_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
